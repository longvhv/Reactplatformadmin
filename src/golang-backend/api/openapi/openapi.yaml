components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from /auth/login endpoint.
        
        Example:
        ```
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        ```
  
  schemas:
    # Import common schemas
    BaseModel:
      $ref: './components/schemas/common.yaml#/BaseModel'
    
    PaginationMeta:
      $ref: './components/schemas/common.yaml#/PaginationMeta'
    
    SuccessResponse:
      $ref: './components/responses/success.yaml#/SuccessResponse'
    
    ErrorResponse:
      $ref: './components/responses/errors.yaml#/ErrorResponse'
    
    # Entity schemas
    User:
      $ref: './components/schemas/user.yaml#/User'
    
    Tenant:
      $ref: './components/schemas/tenant.yaml#/Tenant'
    
    Role:
      $ref: './components/schemas/role.yaml#/Role'
    
    Permission:
      $ref: './components/schemas/permission.yaml#/Permission'
    
    Application:
      $ref: './components/schemas/application.yaml#/Application'
    
    Product:
      $ref: './components/schemas/product.yaml#/Product'
    
    Package:
      $ref: './components/schemas/package.yaml#/Package'
    
    Order:
      $ref: './components/schemas/order.yaml#/Order'
    
    Invoice:
      $ref: './components/schemas/invoice.yaml#/Invoice'
  
  parameters:
    # Common parameters
    PageParam:
      $ref: './components/parameters/pagination.yaml#/PageParam'
    
    LimitParam:
      $ref: './components/parameters/pagination.yaml#/LimitParam'
    
    SortByParam:
      $ref: './components/parameters/common.yaml#/SortByParam'
    
    SortOrderParam:
      $ref: './components/parameters/common.yaml#/SortOrderParam'
    
    SearchParam:
      $ref: './components/parameters/filters.yaml#/SearchParam'
    
    # Path parameters
    IDParam:
      $ref: './components/parameters/common.yaml#/IDParam'
    
    TenantIDParam:
      $ref: './components/parameters/common.yaml#/TenantIDParam'
  
  responses:
    # Success responses
    OKResponse:
      $ref: './components/responses/success.yaml#/OKResponse'
    
