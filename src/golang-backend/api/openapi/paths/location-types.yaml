/location-types:
  get:
    summary: List location types
    description: Retrieve location types
    tags:
      - Location Types
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - name: tenant_id
        in: query
        schema:
          type: string
          format: uuid
      - name: is_system
        in: query
        schema:
          type: boolean
      - name: is_active
        in: query
        schema:
          type: boolean
      - $ref: '../components/parameters/filters.yaml#/SearchParam'
    responses:
      '200':
        description: Types retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/location-type.yaml#/LocationTypeListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create location type
    description: Create a new location type
    tags:
      - Location Types
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/location-type.yaml#/CreateLocationTypeRequest'
    responses:
      '201':
        description: Type created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/location-type.yaml#/LocationTypeResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '409':
        $ref: '../components/responses/errors.yaml#/ConflictError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/location-types/{id}:
  get:
    summary: Get type by ID
    description: Retrieve a single location type
    tags:
      - Location Types
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Type retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/location-type.yaml#/LocationTypeResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update type
    description: Update location type
    tags:
      - Location Types
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/location-type.yaml#/UpdateLocationTypeRequest'
    responses:
      '200':
        description: Type updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/location-type.yaml#/LocationTypeResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete type
    description: Delete location type (soft delete)
    tags:
      - Location Types
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
