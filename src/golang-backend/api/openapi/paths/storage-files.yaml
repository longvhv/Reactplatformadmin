/storage-files:
  get:
    summary: List storage files
    description: Retrieve files and folders
    tags:
      - Storage Files
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - $ref: '../components/parameters/common.yaml#/SortByParam'
      - $ref: '../components/parameters/common.yaml#/SortOrderParam'
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: parent_id
        in: query
        schema:
          type: string
          format: uuid
        description: Filter by parent folder
      - name: is_folder
        in: query
        schema:
          type: boolean
      - name: category
        in: query
        schema:
          type: string
          enum: [MEDIA, DOCUMENT, ARCHIVE, EXPORT, SYSTEM]
      - name: status
        in: query
        schema:
          type: string
          enum: [UPLOADING, PROCESSING, READY, FAILED]
      - $ref: '../components/parameters/filters.yaml#/SearchParam'
    responses:
      '200':
        description: Files retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/storage-file.yaml#/StorageFileListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create file/folder
    description: Create file record or folder
    tags:
      - Storage Files
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/storage-file.yaml#/CreateStorageFileRequest'
    responses:
      '201':
        description: File created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/storage-file.yaml#/StorageFileResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/storage-files/{id}:
  get:
    summary: Get file by ID
    description: Retrieve a single file
    tags:
      - Storage Files
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: File retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/storage-file.yaml#/StorageFileResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update file
    description: Update file metadata
    tags:
      - Storage Files
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/storage-file.yaml#/UpdateStorageFileRequest'
    responses:
      '200':
        description: File updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/storage-file.yaml#/StorageFileResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete file
    description: Delete file/folder (soft delete)
    tags:
      - Storage Files
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/storage-files/{id}/download:
  get:
    summary: Download file
    description: Get download URL or stream file
    tags:
      - Storage Files
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Download URL generated
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    download_url:
                      type: string
                      example: "https://cdn.example.com/abc123.pdf?token=xyz"
                    expires_at:
                      type: string
                      format: date-time
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
