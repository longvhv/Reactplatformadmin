/user-sessions:
  get:
    summary: List user sessions
    description: Retrieve user sessions
    tags:
      - User Sessions
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - name: user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: is_active
        in: query
        schema:
          type: boolean
    responses:
      '200':
        description: Sessions retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-session.yaml#/UserSessionListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/user-sessions/{id}:
  get:
    summary: Get session by ID
    description: Retrieve a single session
    tags:
      - User Sessions
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Session retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-session.yaml#/UserSessionResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete session
    description: Terminate user session
    tags:
      - User Sessions
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/user-sessions/me:
  get:
    summary: Get my sessions
    description: Retrieve current user's sessions
    tags:
      - User Sessions
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Sessions retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-session.yaml#/UserSessionListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/user-sessions/me/terminate-all:
  post:
    summary: Terminate all sessions
    description: Terminate all user sessions except current
    tags:
      - User Sessions
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Sessions terminated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                  example: "All sessions terminated"
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
