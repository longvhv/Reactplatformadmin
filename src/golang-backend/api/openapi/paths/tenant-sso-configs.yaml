/tenant-sso-configs:
  get:
    summary: List SSO configs
    description: Retrieve tenant SSO configurations
    tags:
      - Tenant SSO Configs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: provider
        in: query
        schema:
          type: string
          enum: [SAML, OAUTH2, OIDC, LDAP, CAS, OTHER]
      - name: status
        in: query
        schema:
          type: string
          enum: [ACTIVE, INACTIVE, TESTING, DEPRECATED]
    responses:
      '200':
        description: Configs retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-sso-config.yaml#/TenantSSOConfigListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create SSO config
    description: Create a new SSO configuration
    tags:
      - Tenant SSO Configs
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/tenant-sso-config.yaml#/CreateTenantSSOConfigRequest'
    responses:
      '201':
        description: Config created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-sso-config.yaml#/TenantSSOConfigResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/tenant-sso-configs/{id}:
  get:
    summary: Get SSO config by ID
    description: Retrieve a single SSO configuration
    tags:
      - Tenant SSO Configs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Config retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-sso-config.yaml#/TenantSSOConfigResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update SSO config
    description: Update SSO configuration
    tags:
      - Tenant SSO Configs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/tenant-sso-config.yaml#/UpdateTenantSSOConfigRequest'
    responses:
      '200':
        description: Config updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-sso-config.yaml#/TenantSSOConfigResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete SSO config
    description: Delete SSO configuration
    tags:
      - Tenant SSO Configs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/tenant-sso-configs/{id}/test:
  post:
    summary: Test SSO config
    description: Test SSO configuration
    tags:
      - Tenant SSO Configs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Test completed
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                  example: "SSO configuration is valid"
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
