/traffic-logs:
  get:
    summary: List traffic logs
    description: Retrieve traffic logs
    tags:
      - Traffic Logs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - name: tenant_id
        in: query
        schema:
          type: string
          format: uuid
      - name: user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: app_code
        in: query
        schema:
          type: string
      - name: method
        in: query
        schema:
          type: string
      - name: status_code
        in: query
        schema:
          type: integer
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
    responses:
      '200':
        description: Logs retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/traffic-log.yaml#/TrafficLogListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create traffic log
    description: Record traffic event
    tags:
      - Traffic Logs
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/traffic-log.yaml#/CreateTrafficLogRequest'
    responses:
      '201':
        description: Log created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/traffic-log.yaml#/TrafficLogResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/traffic-logs/{id}:
  get:
    summary: Get log by ID
    description: Retrieve a single traffic log
    tags:
      - Traffic Logs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Log retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/traffic-log.yaml#/TrafficLogResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/traffic-logs/stats:
  get:
    summary: Get traffic statistics
    description: Get traffic statistics and analytics
    tags:
      - Traffic Logs
    security:
      - BearerAuth: []
    parameters:
      - name: tenant_id
        in: query
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: group_by
        in: query
        schema:
          type: string
          enum: [hour, day, week, month]
          default: "day"
    responses:
      '200':
        description: Statistics retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    total_requests:
                      type: integer
                    avg_latency_ms:
                      type: number
                    total_traffic_bytes:
                      type: integer
                    by_status:
                      type: object
                    by_method:
                      type: object
                    trend:
                      type: array
                      items:
                        type: object
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
