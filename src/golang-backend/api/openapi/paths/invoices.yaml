/invoices:
  get:
    summary: List all invoices
    description: Retrieve a paginated list of invoices with optional filters
    tags:
      - Invoices
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - $ref: '../components/parameters/common.yaml#/SortByParam'
      - $ref: '../components/parameters/common.yaml#/SortOrderParam'
      - $ref: '../components/parameters/filters.yaml#/SearchParam'
      - name: tenant_id
        in: query
        schema:
          type: string
          format: uuid
      - name: order_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '../components/schemas/common.yaml#/InvoiceStatus'
      - name: payment_method
        in: query
        schema:
          type: string
          enum: [CREDIT_CARD, BANK_TRANSFER, PAYPAL, STRIPE, OFFLINE]
      - $ref: '../components/parameters/filters.yaml#/FromDateParam'
      - $ref: '../components/parameters/filters.yaml#/ToDateParam'
    responses:
      '200':
        description: Invoices retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/invoice.yaml#/InvoiceListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create a new invoice
    description: Create a new invoice from an order
    tags:
      - Invoices
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/invoice.yaml#/CreateInvoiceRequest'
    responses:
      '201':
        description: Invoice created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/invoice.yaml#/InvoiceResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/invoices/{id}:
  get:
    summary: Get invoice by ID
    description: Retrieve a single invoice by ID with all items
    tags:
      - Invoices
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Invoice retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/invoice.yaml#/InvoiceResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update invoice
    description: Update invoice information
    tags:
      - Invoices
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/invoice.yaml#/UpdateInvoiceRequest'
    responses:
      '200':
        description: Invoice updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/invoice.yaml#/InvoiceResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete invoice
    description: Soft delete an invoice (only DRAFT invoices can be deleted)
    tags:
      - Invoices
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/invoices/{id}/pay:
  post:
    summary: Pay invoice
    description: Record payment for an invoice
    tags:
      - Invoices
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/invoice.yaml#/PayInvoiceRequest'
    responses:
      '200':
        description: Invoice payment recorded successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/invoice.yaml#/InvoiceResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/invoices/{id}/void:
  post:
    summary: Void invoice
    description: Void an invoice (changes status to VOID)
    tags:
      - Invoices
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
                description: Void reason
                example: "Duplicate invoice"
    responses:
      '200':
        description: Invoice voided successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/invoice.yaml#/InvoiceResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/invoices/{id}/pdf:
  get:
    summary: Download invoice PDF
    description: Generate and download invoice as PDF
    tags:
      - Invoices
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: PDF generated successfully
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
