/orders:
  get:
    summary: List all orders
    description: Retrieve a paginated list of orders with optional filters
    tags:
      - Orders
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - $ref: '../components/parameters/common.yaml#/SortByParam'
      - $ref: '../components/parameters/common.yaml#/SortOrderParam'
      - $ref: '../components/parameters/filters.yaml#/SearchParam'
      - name: tenant_id
        in: query
        schema:
          type: string
          format: uuid
      - name: user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '../components/schemas/common.yaml#/OrderStatus'
      - name: order_type
        in: query
        schema:
          type: string
          enum: [NEW_SUBSCRIPTION, RENEWAL, UPGRADE, DOWNGRADE, ADDON]
      - name: payment_status
        in: query
        schema:
          type: string
          enum: [PENDING, PAID, FAILED, REFUNDED, PARTIAL]
      - $ref: '../components/parameters/filters.yaml#/FromDateParam'
      - $ref: '../components/parameters/filters.yaml#/ToDateParam'
    responses:
      '200':
        description: Orders retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/order.yaml#/OrderListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create a new order
    description: Create a new order for products/packages
    tags:
      - Orders
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/order.yaml#/CreateOrderRequest'
    responses:
      '201':
        description: Order created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/order.yaml#/OrderResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/orders/{id}:
  get:
    summary: Get order by ID
    description: Retrieve a single order by ID with all items
    tags:
      - Orders
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Order retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/order.yaml#/OrderResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update order
    description: Update order status or payment information
    tags:
      - Orders
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/order.yaml#/UpdateOrderRequest'
    responses:
      '200':
        description: Order updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/order.yaml#/OrderResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete order
    description: Soft delete an order (only DRAFT orders can be deleted)
    tags:
      - Orders
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/orders/{id}/confirm:
  post:
    summary: Confirm order
    description: Confirm a pending order (changes status to CONFIRMED)
    tags:
      - Orders
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Order confirmed successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/order.yaml#/OrderResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/orders/{id}/cancel:
  post:
    summary: Cancel order
    description: Cancel an order (changes status to CANCELLED)
    tags:
      - Orders
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
                description: Cancellation reason
                example: "Customer requested cancellation"
    responses:
      '200':
        description: Order cancelled successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/order.yaml#/OrderResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
