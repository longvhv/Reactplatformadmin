/user-groups:
  get:
    summary: List user groups
    description: Retrieve a paginated list of user groups
    tags:
      - User Groups
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - $ref: '../components/parameters/common.yaml#/SortByParam'
      - $ref: '../components/parameters/common.yaml#/SortOrderParam'
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum: [ACTIVE, INACTIVE, ARCHIVED]
      - name: group_type
        in: query
        schema:
          type: string
      - $ref: '../components/parameters/filters.yaml#/SearchParam'
    responses:
      '200':
        description: Groups retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-group.yaml#/UserGroupListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create user group
    description: Create a new user group
    tags:
      - User Groups
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user-group.yaml#/CreateUserGroupRequest'
    responses:
      '201':
        description: Group created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-group.yaml#/UserGroupResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '409':
        $ref: '../components/responses/errors.yaml#/ConflictError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/user-groups/{id}:
  get:
    summary: Get group by ID
    description: Retrieve a single user group
    tags:
      - User Groups
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Group retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-group.yaml#/UserGroupResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update group
    description: Update user group details
    tags:
      - User Groups
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user-group.yaml#/UpdateUserGroupRequest'
    responses:
      '200':
        description: Group updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-group.yaml#/UserGroupResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete group
    description: Delete a user group (soft delete)
    tags:
      - User Groups
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
