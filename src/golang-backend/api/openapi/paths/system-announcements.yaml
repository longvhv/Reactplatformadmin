/system-announcements:
  get:
    summary: List system announcements
    description: Retrieve system announcements
    tags:
      - System Announcements
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      - name: is_published
        in: query
        schema:
          type: boolean
      - name: is_pinned
        in: query
        schema:
          type: boolean
    responses:
      '200':
        description: Announcements retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/system-announcement.yaml#/SystemAnnouncementListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create announcement
    description: Create a new system announcement
    tags:
      - System Announcements
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/system-announcement.yaml#/CreateSystemAnnouncementRequest'
    responses:
      '201':
        description: Announcement created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/system-announcement.yaml#/SystemAnnouncementResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/system-announcements/{id}:
  get:
    summary: Get announcement by ID
    description: Retrieve a single system announcement
    tags:
      - System Announcements
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Announcement retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/system-announcement.yaml#/SystemAnnouncementResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update announcement
    description: Update system announcement
    tags:
      - System Announcements
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/system-announcement.yaml#/UpdateSystemAnnouncementRequest'
    responses:
      '200':
        description: Announcement updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/system-announcement.yaml#/SystemAnnouncementResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete announcement
    description: Delete system announcement
    tags:
      - System Announcements
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/system-announcements/{id}/publish:
  post:
    summary: Publish announcement
    description: Publish system announcement
    tags:
      - System Announcements
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Announcement published successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/system-announcement.yaml#/SystemAnnouncementResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/system-announcements/active:
  get:
    summary: Get active announcements
    description: Retrieve currently active announcements
    tags:
      - System Announcements
    security:
      - BearerAuth: []
    parameters:
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: location
        in: query
        schema:
          type: string
    responses:
      '200':
        description: Active announcements retrieved
        content:
          application/json:
            schema:
              $ref: '../components/schemas/system-announcement.yaml#/SystemAnnouncementListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
