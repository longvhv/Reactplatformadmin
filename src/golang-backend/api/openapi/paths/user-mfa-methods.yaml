/user-mfa-methods:
  get:
    summary: List MFA methods
    description: Retrieve user MFA methods
    tags:
      - User MFA Methods
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - name: user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: method_type
        in: query
        schema:
          type: string
          enum: [TOTP, SMS, EMAIL, WEBAUTHN, BACKUP_CODES]
      - name: status
        in: query
        schema:
          type: string
          enum: [ACTIVE, INACTIVE, SUSPENDED, REVOKED, PENDING]
      - name: is_verified
        in: query
        schema:
          type: boolean
    responses:
      '200':
        description: Methods retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-mfa-method.yaml#/MFAMethodListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create MFA method
    description: Register a new MFA method
    tags:
      - User MFA Methods
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user-mfa-method.yaml#/CreateMFAMethodRequest'
    responses:
      '201':
        description: Method created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-mfa-method.yaml#/MFAMethodResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/user-mfa-methods/{id}:
  get:
    summary: Get method by ID
    description: Retrieve a single MFA method
    tags:
      - User MFA Methods
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Method retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-mfa-method.yaml#/MFAMethodResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update method
    description: Update MFA method details
    tags:
      - User MFA Methods
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user-mfa-method.yaml#/UpdateMFAMethodRequest'
    responses:
      '200':
        description: Method updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-mfa-method.yaml#/MFAMethodResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete method
    description: Remove MFA method
    tags:
      - User MFA Methods
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/user-mfa-methods/me:
  get:
    summary: Get my MFA methods
    description: Retrieve current user's MFA methods
    tags:
      - User MFA Methods
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Methods retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-mfa-method.yaml#/MFAMethodListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/user-mfa-methods/{id}/verify:
  post:
    summary: Verify MFA method
    description: Verify MFA method with code
    tags:
      - User MFA Methods
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: "123456"
            required:
              - code
    responses:
      '200':
        description: Method verified successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user-mfa-method.yaml#/MFAMethodResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
