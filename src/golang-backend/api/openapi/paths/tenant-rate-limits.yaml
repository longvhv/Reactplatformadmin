/tenant-rate-limits:
  get:
    summary: List tenant rate limits
    description: Retrieve rate limits for tenants
    tags:
      - Tenant Rate Limits
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - name: tenant_id
        in: query
        schema:
          type: string
          format: uuid
      - name: resource_type
        in: query
        schema:
          type: string
      - name: is_active
        in: query
        schema:
          type: boolean
    responses:
      '200':
        description: Rate limits retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-rate-limit.yaml#/TenantRateLimitListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create rate limit
    description: Create a new rate limit for a tenant
    tags:
      - Tenant Rate Limits
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/tenant-rate-limit.yaml#/CreateTenantRateLimitRequest'
    responses:
      '201':
        description: Rate limit created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-rate-limit.yaml#/TenantRateLimitResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/tenant-rate-limits/{id}:
  get:
    summary: Get rate limit by ID
    description: Retrieve a single rate limit
    tags:
      - Tenant Rate Limits
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Rate limit retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-rate-limit.yaml#/TenantRateLimitResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update rate limit
    description: Update rate limit configuration
    tags:
      - Tenant Rate Limits
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/tenant-rate-limit.yaml#/UpdateTenantRateLimitRequest'
    responses:
      '200':
        description: Rate limit updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-rate-limit.yaml#/TenantRateLimitResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete rate limit
    description: Remove a rate limit
    tags:
      - Tenant Rate Limits
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/tenant-rate-limits/{id}/reset:
  post:
    summary: Reset usage counter
    description: Reset the current usage counter for a rate limit
    tags:
      - Tenant Rate Limits
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas/tenant-rate-limit.yaml#/ResetUsageRequest'
    responses:
      '200':
        description: Usage counter reset successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-rate-limit.yaml#/TenantRateLimitResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
