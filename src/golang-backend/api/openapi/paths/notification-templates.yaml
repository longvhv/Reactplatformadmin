/notification-templates:
  get:
    summary: List notification templates
    description: Retrieve notification templates
    tags:
      - Notification Templates
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - $ref: '../components/parameters/common.yaml#/SortByParam'
      - $ref: '../components/parameters/common.yaml#/SortOrderParam'
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: category
        in: query
        schema:
          type: string
      - name: notification_type
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: is_system_template
        in: query
        schema:
          type: boolean
      - $ref: '../components/parameters/filters.yaml#/SearchParam'
    responses:
      '200':
        description: Templates retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/notification-template.yaml#/NotificationTemplateListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create notification template
    description: Create a new template
    tags:
      - Notification Templates
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/notification-template.yaml#/CreateNotificationTemplateRequest'
    responses:
      '201':
        description: Template created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/notification-template.yaml#/NotificationTemplateResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '409':
        $ref: '../components/responses/errors.yaml#/ConflictError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/notification-templates/{id}:
  get:
    summary: Get template by ID
    description: Retrieve a single template
    tags:
      - Notification Templates
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Template retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/notification-template.yaml#/NotificationTemplateResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update template
    description: Update template details
    tags:
      - Notification Templates
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/notification-template.yaml#/UpdateNotificationTemplateRequest'
    responses:
      '200':
        description: Template updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/notification-template.yaml#/NotificationTemplateResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete template
    description: Delete template (soft delete)
    tags:
      - Notification Templates
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/notification-templates/{id}/preview:
  post:
    summary: Preview template
    description: Render template with sample data
    tags:
      - Notification Templates
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                description: Sample data
                example:
                  user_name: "John Doe"
                  app_name: "MyApp"
    responses:
      '200':
        description: Preview generated
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    subject:
                      type: string
                    body_text:
                      type: string
                    body_html:
                      type: string
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
