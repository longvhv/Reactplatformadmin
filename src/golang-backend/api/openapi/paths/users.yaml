/users/{id}/status:
  patch:
    summary: Update user status
    description: Update user account status (activate, suspend, ban)
    tags:
      - Users
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user.yaml#/UpdateUserStatusRequest'
          examples:
            activate:
              summary: Activate user
              value:
                status: "ACTIVE"
            suspend:
              summary: Suspend user
              value:
                status: "SUSPENDED"
                reason: "Policy violation"
    responses:
      '200':
        description: User status updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/user.yaml#/UserResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/users/{id}/mfa/enable:
  post:
    summary: Enable MFA for user
    description: Enable multi-factor authentication for user account
    tags:
      - Users
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user.yaml#/EnableMFARequest'
          example:
            mfa_type: "TOTP"
    responses:
      '200':
        description: MFA enabled successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    message:
                      type: string
                      example: "MFA enabled successfully"
                    qr_code:
                      type: string
                      description: Base64 encoded QR code image (for TOTP)
                      example: "data:image/png;base64,iVBORw0KGgo..."
                    secret:
                      type: string
                      description: Secret key for manual entry
                      example: "JBSWY3DPEHPK3PXP"
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/users/{id}/mfa/disable:
  post:
    summary: Disable MFA for user
    description: Disable multi-factor authentication for user account
    tags:
      - Users
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: MFA disabled successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    message:
                      type: string
                      example: "MFA disabled successfully"
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
