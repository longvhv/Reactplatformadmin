/tenant-domains:
  get:
    summary: List tenant domains
    description: Retrieve a paginated list of tenant domains
    tags:
      - Tenant Domains
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - $ref: '../components/parameters/common.yaml#/SortByParam'
      - $ref: '../components/parameters/common.yaml#/SortOrderParam'
      - name: tenant_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum: [PENDING_VERIFICATION, VERIFIED, FAILED, INACTIVE]
      - name: domain_type
        in: query
        schema:
          type: string
          enum: [PRIMARY, CUSTOM, SUBDOMAIN]
    responses:
      '200':
        description: Domains retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-domain.yaml#/TenantDomainListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Add custom domain
    description: Add a custom domain for a tenant
    tags:
      - Tenant Domains
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/tenant-domain.yaml#/CreateTenantDomainRequest'
    responses:
      '201':
        description: Domain created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-domain.yaml#/TenantDomainResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '409':
        $ref: '../components/responses/errors.yaml#/ConflictError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/tenant-domains/{id}:
  get:
    summary: Get domain by ID
    description: Retrieve a single domain by ID
    tags:
      - Tenant Domains
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Domain retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-domain.yaml#/TenantDomainResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update domain
    description: Update domain settings
    tags:
      - Tenant Domains
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/tenant-domain.yaml#/UpdateTenantDomainRequest'
    responses:
      '200':
        description: Domain updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-domain.yaml#/TenantDomainResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete domain
    description: Remove a custom domain
    tags:
      - Tenant Domains
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/tenant-domains/{id}/verify:
  post:
    summary: Verify domain
    description: Verify domain ownership
    tags:
      - Tenant Domains
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../components/schemas/tenant-domain.yaml#/VerifyDomainRequest'
    responses:
      '200':
        description: Domain verification initiated
        content:
          application/json:
            schema:
              $ref: '../components/schemas/tenant-domain.yaml#/TenantDomainResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
