/system-jobs:
  get:
    summary: List system jobs
    description: Retrieve system jobs
    tags:
      - System Jobs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - name: job_type
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: is_active
        in: query
        schema:
          type: boolean
      - $ref: '../components/parameters/filters.yaml#/SearchParam'
    responses:
      '200':
        description: Jobs retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/system-job.yaml#/SystemJobListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create system job
    description: Create a new job
    tags:
      - System Jobs
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/system-job.yaml#/CreateSystemJobRequest'
    responses:
      '201':
        description: Job created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/system-job.yaml#/SystemJobResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/system-jobs/{id}:
  get:
    summary: Get job by ID
    description: Retrieve a single job
    tags:
      - System Jobs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Job retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/system-job.yaml#/SystemJobResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update job
    description: Update job details
    tags:
      - System Jobs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/system-job.yaml#/UpdateSystemJobRequest'
    responses:
      '200':
        description: Job updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/system-job.yaml#/SystemJobResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete job
    description: Delete system job
    tags:
      - System Jobs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/system-jobs/{id}/run:
  post:
    summary: Run job manually
    description: Trigger job execution
    tags:
      - System Jobs
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Job triggered successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                  example: "Job execution started"
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
