/service-accounts:
  get:
    summary: List service accounts
    description: Retrieve service accounts
    tags:
      - Service Accounts
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/pagination.yaml#/PageParam'
      - $ref: '../components/parameters/pagination.yaml#/LimitParam'
      - name: tenant_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: member_id
        in: query
        schema:
          type: string
          format: uuid
      - name: is_active
        in: query
        schema:
          type: boolean
      - $ref: '../components/parameters/filters.yaml#/SearchParam'
    responses:
      '200':
        description: Accounts retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/service-account.yaml#/ServiceAccountListResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  post:
    summary: Create service account
    description: Create a new service account
    tags:
      - Service Accounts
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/service-account.yaml#/CreateServiceAccountRequest'
    responses:
      '201':
        description: Account created successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/service-account.yaml#/ServiceAccountCreateResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/service-accounts/{id}:
  get:
    summary: Get account by ID
    description: Retrieve a single service account
    tags:
      - Service Accounts
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Account retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/service-account.yaml#/ServiceAccountResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  patch:
    summary: Update account
    description: Update service account details
    tags:
      - Service Accounts
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/service-account.yaml#/UpdateServiceAccountRequest'
    responses:
      '200':
        description: Account updated successfully
        content:
          application/json:
            schema:
              $ref: '../components/schemas/service-account.yaml#/ServiceAccountResponse'
      '400':
        $ref: '../components/responses/errors.yaml#/ValidationError'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
  
  delete:
    summary: Delete account
    description: Delete service account (soft delete)
    tags:
      - Service Accounts
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '204':
        $ref: '../components/responses/success.yaml#/NoContentResponse'
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'

/service-accounts/{id}/rotate-secret:
  post:
    summary: Rotate secret
    description: Generate new client secret
    tags:
      - Service Accounts
    security:
      - BearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/IDParam'
    responses:
      '200':
        description: Secret rotated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    client_secret:
                      type: string
                      example: "cs_secret_new_abc123xyz789"
      '401':
        $ref: '../components/responses/errors.yaml#/UnauthorizedError'
      '403':
        $ref: '../components/responses/errors.yaml#/ForbiddenError'
      '404':
        $ref: '../components/responses/errors.yaml#/NotFoundError'
      '500':
        $ref: '../components/responses/errors.yaml#/InternalServerError'
