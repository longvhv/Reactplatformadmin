version: '3.8'

services:
  # YugabyteDB - Distributed SQL Database
  yugabyte:
    image: yugabytedb/yugabyte:2.19.2.0-b121
    container_name: vhv-yugabyte
    command: bin/yugabyted start --daemon=false --ui=false
    ports:
      - "5433:5433"  # YSQL (PostgreSQL-compatible)
      - "9000:9000"  # YugabyteDB Master Web UI
      - "7000:7000"  # YugabyteDB Master RPC
    environment:
      - YSQL_USER=yugabyte
      - YSQL_PASSWORD=yugabyte
      - YSQL_DB=vhv_platform
    volumes:
      - yugabyte_data:/root/var/data
    healthcheck:
      test: ["CMD", "bin/ysqlsh", "-h", "localhost", "-U", "yugabyte", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vhv-network

  # ClickHouse - Analytics & Logging Database
  clickhouse:
    image: clickhouse/clickhouse-server:23.11-alpine
    container_name: vhv-clickhouse
    ports:
      - "8123:8123"  # HTTP interface
      - "9001:9000"  # Native interface
    environment:
      CLICKHOUSE_DB: vhv_logs
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vhv-network

  # Dragonfly - High-performance Redis alternative
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.13.0
    container_name: vhv-dragonfly
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1
    volumes:
      - dragonfly_data:/data
    command: >
      --logtostderr
      --maxmemory=2gb
      --cache_mode=true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vhv-network

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vhv-api
    ports:
      - "8080:8080"
    environment:
      # Server
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      SERVER_ENV: development
      
      # YugabyteDB
      DB_HOST: yugabyte
      DB_PORT: 5433
      DB_NAME: vhv_platform
      DB_USER: yugabyte
      DB_PASSWORD: yugabyte
      DB_SSL_MODE: disable
      DB_MAX_OPEN_CONNS: 25
      DB_MAX_IDLE_CONNS: 5
      
      # ClickHouse
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      CLICKHOUSE_DB: vhv_logs
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse123
      
      # Dragonfly Cache
      REDIS_HOST: dragonfly
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_POOL_SIZE: 10
      
      # JWT
      JWT_SECRET: your-secret-key-change-in-production
      JWT_ACCESS_TOKEN_EXPIRY: 15m
      JWT_REFRESH_TOKEN_EXPIRY: 7d
      
      # Logging
      LOG_LEVEL: debug
      LOG_FORMAT: json
    depends_on:
      yugabyte:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    networks:
      - vhv-network
    restart: unless-stopped
    profiles:
      - full

volumes:
  yugabyte_data:
    driver: local
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
  dragonfly_data:
    driver: local

networks:
  vhv-network:
    driver: bridge